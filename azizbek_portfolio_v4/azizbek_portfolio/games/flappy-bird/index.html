<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flappy Bird — Azizbek</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(140deg,#101c32,#183c48);font-family:Arial,sans-serif;color:#fff}
.wrap{width:min(100%,520px);text-align:center}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.top a{color:#a9f5dc;text-decoration:none;font-weight:bold}.top h1{font-size:clamp(22px,5vw,32px);margin:0}
.gamebox{position:relative;width:100%;border:4px solid #f4f0c9;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px #0006;background:#b6e8f1}
canvas{display:block;width:100%;height:auto;touch-action:manipulation}.hint{margin:12px 0;color:#d5e7ed;font-size:14px;line-height:1.5}.btn{border:0;border-radius:999px;padding:12px 22px;background:#16c99a;color:#082b2b;font-weight:800;font-size:16px;cursor:pointer}.btn:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><a href="../../index.html#loyihalar">← Loyihalarimga qaytish</a><h1>🐤 Flappy Bird</h1></div>
  <div class="gamebox"><canvas id="game" width="432" height="600" aria-label="Flappy Bird o‘yini"></canvas></div>
  <p class="hint">Boshlash va uchish uchun <b>SPACE</b> tugmasini bosing yoki ekranga bosing/tugmani bosing.</p>
  <button class="btn" id="start">O‘yinni boshlash</button>
</main>
<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),startBtn=document.getElementById('start');
const load=(name)=>{const im=new Image();im.src='assets/'+name;return im};
const bg=load('background.png'),birdImgs=[load('bird1.png'),load('bird2.png'),load('bird3.png')],pipeImg=load('pipe.png'),groundImg=load('ground.png');
let bird,pipes,score,best=Number(localStorage.getItem('flappy-best')||0),state='ready',frame=0,groundX=0;
function reset(){bird={x:94,y:255,vy:0,r:14};pipes=[];score=0;frame=0;groundX=0;for(let i=0;i<3;i++)pipes.push({x:470+i*190,top:100+Math.random()*190,passed:false});}
function flap(){if(state==='ready'||state==='over'){reset();state='playing';}bird.vy=-5.5;}
function input(e){if(e)e.preventDefault();if(state==='playing')flap();else flap();}
canvas.addEventListener('pointerdown',input);startBtn.addEventListener('click',input);
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)input();}if(e.code==='Enter'&&state!=='playing')input();});
function drawCover(im,x,y,w,h){if(im.complete&&im.naturalWidth)ctx.drawImage(im,x,y,w,h);}
function end(){state='over';if(score>best){best=score;try{localStorage.setItem('flappy-best',best)}catch(e){}}}
function draw(){
ctx.clearRect(0,0,432,600);
if(bg.complete&&bg.naturalWidth)ctx.drawImage(bg,0,0,432,600);else{ctx.fillStyle='#a8e1ee';ctx.fillRect(0,0,432,600);}
if(state==='playing'){
frame++;bird.vy+=.27;bird.y+=bird.vy;
pipes.forEach(p=>{p.x-=2.5;if(p.x<-85){p.x=432+100;p.top=80+Math.random()*210;p.passed=false;}});
groundX=(groundX+2.5)%432;
}
pipes.forEach(p=>{
const gap=154, topH=p.top;
if(pipeImg.complete&&pipeImg.naturalWidth){
ctx.save();ctx.translate(p.x,topH);ctx.scale(1,-1);ctx.drawImage(pipeImg,0,0,62,Math.max(30,topH));ctx.restore();
ctx.drawImage(pipeImg,p.x,topH+gap,62,Math.max(30,600-(topH+gap)-50));
}else{ctx.fillStyle='#36a852';ctx.fillRect(p.x,0,62,topH);ctx.fillRect(p.x,topH+gap,62,600);}
if(state==='playing'&&!p.passed&&p.x+62<bird.x){p.passed=true;score++;}
if(state==='playing'&&bird.x+12>p.x&&bird.x-12<p.x+62&&(bird.y-10<topH||bird.y+10>topH+gap))end();
});
drawCover(groundImg,-groundX,540,450,84);drawCover(groundImg,432-groundX,540,450,84);
if(!groundImg.complete||!groundImg.naturalWidth){ctx.fillStyle='#c9a85a';ctx.fillRect(0,560,432,40);}
const bi=birdImgs[Math.floor(frame/7)%birdImgs.length];ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.min(.65,Math.max(-.45,bird.vy/10)));drawCover(bi,-20,-15,40,30);ctx.restore();
ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#4b3a2b';ctx.fillStyle='#fff';ctx.font='bold 40px Arial';ctx.strokeText(score,216,66);ctx.fillText(score,216,66);
ctx.textAlign='left';ctx.font='bold 15px Arial';ctx.fillStyle='#fff';ctx.fillText('REKORD: '+best,14,28);
if(state!=='playing'){
ctx.fillStyle='rgba(12,34,52,.62)';ctx.fillRect(30,190,372,160);
ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 27px Arial';ctx.fillText(state==='over'?'O‘YIN TUGADI!':'FLAPPY BIRD',216,235);
ctx.font='bold 18px Arial';ctx.fillText(state==='over'?('Natija: '+score+'  •  Rekord: '+best):'Uchish uchun bosing',216,274);
ctx.font='15px Arial';ctx.fillText(state==='over'?'Qayta boshlash uchun bosing':'SPACE yoki ekranga bosing',216,309);
}
if(state==='playing'&&(bird.y>555||bird.y<0))end();
requestAnimationFrame(draw);
}
reset();draw();
})();
</script>
</body></html>
